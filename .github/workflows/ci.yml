name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # Linux Setup
      # ─────────────────────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            liballegro5-dev \
            liballegro-acodec5-dev \
            liballegro-audio5-dev \
            liballegro-image5-dev \
            liballegro-ttf5-dev \
            liblua5.4-dev \
            libgl1-mesa-dev \
            libasound2-dev

      # ─────────────────────────────────────────────────────────────────────────
      # macOS Setup
      # ─────────────────────────────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install allegro lua pkg-config ninja

      # ─────────────────────────────────────────────────────────────────────────
      # Windows Setup
      # ─────────────────────────────────────────────────────────────────────────
      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          vcpkg install allegro5 lua --triplet x64-windows

      # ─────────────────────────────────────────────────────────────────────────
      # Clone Dependencies
      # ─────────────────────────────────────────────────────────────────────────
      # NOTE: Allegro Legacy is no longer needed as of Phase 2 (native Allegro 5 mode)
      # The legacy library is retained in deps/ for optional fallback use
      
      - name: Clone libnoise
        run: |
          git clone https://github.com/eXpl0it3r/libnoise.git deps/libnoise

      # ─────────────────────────────────────────────────────────────────────────
      # Build Allegro Legacy (OPTIONAL - only if USE_ALLEGRO_LEGACY=ON)
      # ─────────────────────────────────────────────────────────────────────────
      # Allegro Legacy build steps removed - project now uses native Allegro 5
      # To re-enable legacy mode, set -DUSE_ALLEGRO_LEGACY=ON in CMake configure

      # ─────────────────────────────────────────────────────────────────────────
      # Build Game
      # ─────────────────────────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"

      - name: Build (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd build
          ninja

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd build
          cmake --build . --config Release

      # ─────────────────────────────────────────────────────────────────────────
      # Verify Build
      # ─────────────────────────────────────────────────────────────────────────
      - name: Verify executable exists (Unix)
        if: matrix.platform != 'windows'
        run: |
          ls -la build/src/starflighttlc
          file build/src/starflighttlc

      - name: Verify executable exists (Windows)
        if: matrix.platform == 'windows'
        run: |
          dir build\src\Release\starflighttlc.exe
