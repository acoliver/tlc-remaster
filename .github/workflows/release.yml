name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Build artifacts for each platform
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: starflight-tlc-linux-x64
          - os: macos-14
            platform: macos-arm64
            artifact_name: starflight-tlc-macos-arm64

          - os: windows-latest
            platform: windows
            artifact_name: starflight-tlc-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # Clone Dependencies (all platforms)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Clone Allegro Legacy
        run: |
          git clone https://github.com/acoliver/Allegro-Legacy.git deps/allegro-legacy

      - name: Clone libnoise
        run: |
          git clone https://github.com/eXpl0it3r/libnoise.git deps/libnoise

      # ─────────────────────────────────────────────────────────────────────────
      # Linux Setup & Build
      # ─────────────────────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            liballegro5-dev \
            liballegro-acodec5-dev \
            liballegro-audio5-dev \
            liballegro-image5-dev \
            liballegro-ttf5-dev \
            liblua5.4-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Build Allegro Legacy (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd deps/allegro-legacy
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          ninja

      - name: Build & Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=/usr
          ninja
          
          # Create package structure
          cd ..
          mkdir -p package/starflight-tlc
          cp build/src/starflighttlc package/starflight-tlc/
          cp -r bin/data package/starflight-tlc/
          mkdir -p package/starflight-tlc/saves
          
          # Copy shared libraries
          mkdir -p package/starflight-tlc/lib
          cp deps/allegro-legacy/build/lib/*.so* package/starflight-tlc/lib/ 2>/dev/null || true
          
          # Create launcher script
          cat > package/starflight-tlc/starflight-tlc.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          cd "$SCRIPT_DIR"
          exec ./starflighttlc "$@"
          EOF
          chmod +x package/starflight-tlc/starflight-tlc.sh
          
          # Create tarball
          cd package
          tar -czvf ../starflight-tlc-${{ inputs.version }}-linux-x64.tar.gz starflight-tlc

      # ─────────────────────────────────────────────────────────────────────────
      # macOS Setup & Build
      # ─────────────────────────────────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install allegro lua pkg-config ninja
          BREW_PREFIX="$(brew --prefix)"
          if [ "$BREW_PREFIX" != "/opt/homebrew" ]; then
            sudo mkdir -p /opt/homebrew/opt
            sudo ln -s "$BREW_PREFIX/opt/allegro" /opt/homebrew/opt/allegro || true
          fi

      - name: Build Allegro Legacy (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          # Get Allegro5 paths from pkg-config
          ALLEGRO_CFLAGS=$(pkg-config --cflags allegro-5 allegro_main-5 allegro_image-5 allegro_font-5 allegro_ttf-5 allegro_primitives-5 allegro_audio-5 allegro_acodec-5)
          
          cd deps/allegro-legacy
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_FLAGS="$ALLEGRO_CFLAGS" \
            -DCMAKE_CXX_FLAGS="$ALLEGRO_CFLAGS"
          ninja

      - name: Build & Package (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          ninja
          
          # Create macOS app bundle
          cd ..
          APP_NAME="Starflight TLC.app"
          mkdir -p "package/$APP_NAME/Contents/MacOS"
          mkdir -p "package/$APP_NAME/Contents/Resources"
          mkdir -p "package/$APP_NAME/Contents/Frameworks"
          
          # Copy executable
          cp build/src/starflighttlc "package/$APP_NAME/Contents/MacOS/"
          
          # Copy game data
          cp -r bin/data "package/$APP_NAME/Contents/Resources/"
          mkdir -p "package/$APP_NAME/Contents/Resources/saves"
          
          # Copy Allegro Legacy dylibs
          cp deps/allegro-legacy/build/lib/*.dylib "package/$APP_NAME/Contents/Frameworks/" 2>/dev/null || true
          
          # Create Info.plist
          cat > "package/$APP_NAME/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>starflight-tlc.sh</string>
              <key>CFBundleIdentifier</key>
              <string>com.starflight.tlc</string>
              <key>CFBundleName</key>
              <string>Starflight TLC</string>
              <key>CFBundleDisplayName</key>
              <string>Starflight: The Lost Colony</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Create launcher script that sets up dylib paths
          cat > "package/$APP_NAME/Contents/MacOS/starflight-tlc.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          CONTENTS_DIR="$(dirname "$SCRIPT_DIR")"
          export DYLD_LIBRARY_PATH="$CONTENTS_DIR/Frameworks:$DYLD_LIBRARY_PATH"
          cd "$CONTENTS_DIR/Resources"
          exec "$SCRIPT_DIR/starflighttlc" "$@"
          EOF
          chmod +x "package/$APP_NAME/Contents/MacOS/starflight-tlc.sh"
          
          # Create DMG
          cd package
          hdiutil create -volname "Starflight TLC" -srcfolder "." -ov -format UDZO "../starflight-tlc-${{ inputs.version }}-${{ matrix.platform }}.dmg"

      # ─────────────────────────────────────────────────────────────────────────
      # Windows Setup & Build
      # ─────────────────────────────────────────────────────────────────────────
      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          vcpkg install allegro5 lua --triplet x64-windows

      - name: Build Allegro Legacy (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd deps/allegro-legacy
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" `
            -DCMAKE_C_FLAGS="/I$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" `
            -DCMAKE_CXX_FLAGS="/I$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" `
            -DSTATIC_RUNTIME=OFF `
            -DSHARED=OFF
          cmake --build . --config Release

      - name: Build & Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          cmake --build . --config Release
          
          # Create package directory
          cd ..
          mkdir package\starflight-tlc
          
          # Copy executable
          copy build\src\Release\starflighttlc.exe package\starflight-tlc\
          
          # Copy app icon for installer shortcuts
          copy bin\starflighttlc.ico package\starflight-tlc\
          
          # Copy game data
          xcopy /E /I bin\data package\starflight-tlc\data
          mkdir package\starflight-tlc\saves
          
          # Copy DLLs from vcpkg
          copy $env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll package\starflight-tlc\
          
          # Copy Allegro Legacy DLLs
          if (Test-Path deps\allegro-legacy\build\Release\*.dll) {
            copy deps\allegro-legacy\build\Release\*.dll package\starflight-tlc\
          }
          
          # Copy MSVC runtime DLLs for portability
          $vcRedist = "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT"
          if (Test-Path $vcRedist) {
            copy $vcRedist\*.dll package\starflight-tlc\
          }

      - name: Create Windows Installer
        if: matrix.platform == 'windows'
        run: |
          # Download and install Inno Setup
          choco install innosetup -y
          
          # Build installer
          $env:VERSION = "${{ inputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=${{ inputs.version }} installer\windows\starflight-tlc.iss
          
          # Also create ZIP for portable use
          Compress-Archive -Path package\starflight-tlc -DestinationPath starflight-tlc-${{ inputs.version }}-windows-x64-portable.zip

      # ─────────────────────────────────────────────────────────────────────────
      # Upload Artifacts
      # ─────────────────────────────────────────────────────────────────────────
      - name: Upload artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: starflight-tlc-${{ inputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: starflight-tlc-${{ inputs.version }}-${{ matrix.platform }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows Installer)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-setup
          path: starflight-tlc-${{ inputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - name: Upload artifact (Windows Portable)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-portable
          path: starflight-tlc-${{ inputs.version }}-windows-x64-portable.zip
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -la release-files/

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Starflight TLC v${{ inputs.version }}
          body: |
            ## Starflight: The Lost Colony - v${{ inputs.version }}
            
            ### Downloads
            
            | Platform | Installer | Portable |
            |----------|-----------|----------|
            | Windows (x64) | `starflight-tlc-${{ inputs.version }}-windows-x64-setup.exe` | `starflight-tlc-${{ inputs.version }}-windows-x64-portable.zip` |
            | macOS (Apple Silicon) | `starflight-tlc-${{ inputs.version }}-macos-arm64.dmg` | - |
            | Linux (x64) | - | `starflight-tlc-${{ inputs.version }}-linux-x64.tar.gz` |
            
            ### Installation
            
            **Windows (Installer):**
            - Download and run `starflight-tlc-${{ inputs.version }}-windows-x64-setup.exe`
            - If Windows Defender SmartScreen appears, click **More info** → **Run anyway**
            - Follow the installation wizard
            - Launch from Start Menu or Desktop shortcut
            
            **Windows (Portable):**
            - Extract the ZIP file anywhere
            - If Windows Defender SmartScreen appears, click **More info** → **Run anyway**
            - Run `starflighttlc.exe`
            
            **macOS:**
            - Open the DMG file
            - Drag "Starflight TLC" to Applications
            - When macOS blocks the app, go to **System Settings → Privacy & Security**
              and click **Open Anyway** for Starflight TLC (because it is unsigned)
            
            **Linux:**
            ```bash
            tar -xzf starflight-tlc-${{ inputs.version }}-linux-x64.tar.gz
            cd starflight-tlc
            ./starflight-tlc.sh
            ```
            
            ### System Requirements
            
            - **Windows:** Windows 10 or later (64-bit)
            - **macOS:** macOS 11 (Big Sur) or later
            - **Linux:** Ubuntu 22.04 or equivalent (64-bit)
            
            ### What's New
            
            See the [commit history](https://github.com/${{ github.repository }}/commits/v${{ inputs.version }}) for changes.
          files: release-files/*
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
